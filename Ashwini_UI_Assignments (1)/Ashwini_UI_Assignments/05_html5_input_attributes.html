<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Input Attributes</title></head><body>
<h2>Form</h2>
<form action="#" target="_blank">
Text <input type="text" size="10" maxlength="8" value="abc"><br>
Password <input type="password"><br>
Radio <input type="radio" name="r"> <input type="radio" name="r"><br>
Checkbox <input type="checkbox"><br>
Number <input type="number" min="1" max="10"><br>
Range <input type="range"> Color <input type="color"><br>
Date <input type="date"> Time <input type="time"> Month <input type="month"> Week <input type="week"><br>
File <input type="file"> Email <input type="email" required><br>
Disabled <input disabled value="disabled"> Readonly <input readonly value="readonly"><br>
<input type="button" value="Button"> <input type="reset"> <input type="submit">
</form>
<p><a href="https://example.com" target="_blank">target=_blank (new tab)</a> | <a href="https://example.com" target="_self">target=_self (same tab)</a></p>
<iframe src="https://example.com" width="300" height="120"></iframe>
<marquee>Scrolling marquee text</marquee>
</body></html>
